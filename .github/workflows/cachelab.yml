name: CSAPP Cache Lab
on:
  push:
    branches: [edidada/cachelab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: bash scripts/run_cachelab.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cachelab-results
          path: cachelab/cachelab-grade.log
