name: CSAPP Architecture Lab
on:
  push:
    branches: [edidada/archlab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install official tool build dependencies
        run: sudo apt-get update && sudo apt-get install -y flex bison libfl-dev
      - run: bash scripts/verify_archlab.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archlab-results
          path: test-results/
