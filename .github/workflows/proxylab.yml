name: Proxy Lab
on:
  push:
    branches: [edidada/proxylab]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y net-tools curl
      - run: bash scripts/verify_proxylab.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxylab-results
          path: test-results
