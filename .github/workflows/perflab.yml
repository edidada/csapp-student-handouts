name: CSAPP Performance Lab
on:
  push:
    branches: [edidada/perflab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: bash scripts/verify_perflab.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perflab-results
          path: test-results/
